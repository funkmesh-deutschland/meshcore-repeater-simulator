[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funkmesh-sim"
version = "0.2.0"
description = "Funkabdeckungs-Simulation für MeshCore-Repeater (LoRa 868 MHz) mit Gelände, LoD2-Gebäuden und Bewuchs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Funkmesh Deutschland e.V." }]
dependencies = [
  "numpy>=1.26,<2.4",
  "numba>=0.60",
  "scipy>=1.11",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "shapely>=2.0",
  "lxml>=5",
  "pillow>=10",
  "requests>=2.31",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
gpu = ["numba-cuda[cu12]>=0.20"]
dev = ["pytest>=8"]

[project.scripts]
funkmesh-sim = "funkmesh_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["funkmesh_sim*"]

[tool.setuptools.package-data]
funkmesh_sim = ["static/**/*", "mapper/**/*", "regions/*.geojson"]
